    <text x="545.0" y="426" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.6" fill="#455F3D" text-anchor="middle">PASS</text>
    <text x="346" y="452" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">Un worker qui expire est récupéré sans</text>
    <text x="346" y="469" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">bloquer la file.</text>
  </g>
  <g>
    <rect x="608" y="400" width="264" height="100" rx="10" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="608" y="400" width="4" height="100" rx="2" fill="#C95400"/>
    <text x="626" y="426" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.1" fill="#667085">release_authority</text>
    <rect x="760" y="412" width="98" height="20" rx="4" fill="#FFE5D2"/>
    <text x="809.0" y="426" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.6" fill="#C95400" text-anchor="middle">NON QUALIFIÉE</text>
    <text x="626" y="452" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">Il manque une approbation humaine</text>
    <text x="626" y="469" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">indépendante et une attestation signée.</text>
  </g>
  <g>
    <rect x="888" y="400" width="264" height="100" rx="10" fill="#111418"/>
    <text x="906" y="426" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.1" fill="#A1A6AD">BILAN DE L'ACQUISITION RETENUE</text>
    <text x="906" y="466" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="30" fill="#FFFFFF">10 / 10</text>
    <text x="1018" y="466" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">portes de labo</text>
    <text x="906" y="486" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#A1A6AD">Mise en production : refusée.</text>
  </g>
  <rect x="48" y="512" width="1104" height="60" rx="10" fill="#FFE5D2" stroke="#C95400"/>
  <text x="72" y="538" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12.5" fill="#C95400">CE QUE CE BILAN NE DIT PAS</text>
  <text x="72" y="558" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">Une seule acquisition qualifiante — la quatrième, après trois essais ratés et conservés — sur une seule machine. Ni reproduction externe, ni revue de sécurité humaine.</text>
  <text x="48" y="612" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#A1A6AD">Source : in.gnu6, docs/agent-results/blobin-next-01/CUDA-05F.md — protocole pré-enregistré ; les essais négatifs restent archivés, non réinterprétés.</text>
