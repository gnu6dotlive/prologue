    <text x="825.0" y="198" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.6" fill="#455F3D" text-anchor="middle">PASS</text>
    <text x="626" y="224" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">Un pair hors du groupe autorisé est refusé</text>
    <text x="626" y="241" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">par le noyau.</text>
  </g>
