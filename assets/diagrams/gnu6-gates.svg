<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">Dix portes de laboratoire franchies, autorisation de publication non qualifiée</title>
  <desc id="d">Grille du protocole CUDA-05F : les dix portes opérationnelles de laboratoire passent ; l'autorité de publication, qui exige une approbation humaine indépendante, reste non qualifiée.</desc>
  <rect width="1200" height="640" fill="#F7F3ED"/>
  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#667085">IN.GNU6 · PROTOCOLE CUDA-05F</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#111418">Dix portes de labo franchies, la publication refusée</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#667085">Chaque porte est un test écrit avant l'essai. Aucune ne se déclare elle-même : c'est l'observation qui la ferme ou la laisse ouverte.</text>
  <g>
    <rect x="48" y="172" width="264" height="100" rx="10" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="48" y="172" width="4" height="100" rx="2" fill="#5F7F52"/>
    <text x="66" y="198" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.1" fill="#667085">authorized_host_peer</text>
    <rect x="232" y="184" width="66" height="20" rx="4" fill="#E8EFE5"/>
    <text x="265.0" y="198" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.6" fill="#455F3D" text-anchor="middle">PASS</text>
    <text x="66" y="224" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">Un pair autorisé est accepté, et son</text>
    <text x="66" y="241" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">identité d'hôte est vérifiée.</text>
  </g>
  <g>
    <rect x="328" y="172" width="264" height="100" rx="10" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="328" y="172" width="4" height="100" rx="2" fill="#5F7F52"/>
    <text x="346" y="198" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.1" fill="#667085">host_service_uid</text>
    <rect x="512" y="184" width="66" height="20" rx="4" fill="#E8EFE5"/>
    <text x="545.0" y="198" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.6" fill="#455F3D" text-anchor="middle">PASS</text>
    <text x="346" y="224" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">Le service tourne sous un UID hôte</text>
    <text x="346" y="241" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">distinct de celui du client.</text>
  </g>
  <g>
    <rect x="608" y="172" width="264" height="100" rx="10" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="608" y="172" width="4" height="100" rx="2" fill="#5F7F52"/>
    <text x="626" y="198" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.1" fill="#667085">dac_rejected_peer</text>
