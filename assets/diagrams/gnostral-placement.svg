  <title id="t">Répartition des 48 couches du modèle entre carte graphique et processeur</title>
  <desc id="d">En contrôle, 22 couches tiennent sur la carte et 26 sur le processeur. Sous pression mémoire, 13 couches restent sur la carte et 35 passent sur le processeur, pour un débit presque identique.</desc>

  <rect width="1200" height="560" fill="#F7F3ED"/>

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#667085">GNOSTRAL.RS · PLACEMENT SOUS PRESSION</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#111418">Quand la mémoire se remplit, le modèle se replie</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#667085">Le moteur place chaque couche sur la carte ou sur le processeur, selon la mémoire qu'on lui laisse.</text>

