<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">Le fil rouge de la topologie</title>
  <desc id="d">Quatre projets, une même question : la position d'une chose — barre, paquet, objet de scène, expert de modèle — décide de ce qu'elle peut faire.</desc>

  <rect width="1200" height="640" fill="#F7F3ED"/>

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#667085">LE FIL ROUGE</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#111418">Où les choses se trouvent décide de ce qu'elles peuvent</text>

  <rect x="48" y="112" width="1104" height="54" rx="10" fill="#E6E8EB" stroke="#D7DADF"/>
  <text x="68" y="145" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#111418">La « topologie », ici, n'est pas un mot savant : c'est la carte des places et des liens. Quatre projets, quatre échelles, une même question.</text>

  <!-- carte 1 -->
  <g>
    <rect x="48" y="196" width="258" height="318" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="48" y="196" width="258" height="5" rx="2.5" fill="#C95400"/>
    <text x="70" y="230" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.4" fill="#C95400">GNOSIX</text>
    <text x="70" y="258" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#111418">La barre</text>

    <!-- mini visuel -->
    <rect x="70" y="276" width="214" height="86" rx="8" fill="#F7F3ED"/>
    <rect x="70" y="276" width="214" height="10" rx="4" fill="#111418"/>
    <rect x="70" y="352" width="214" height="10" rx="4" fill="#111418" opacity="0.35"/>
    <path d="M177 292 L177 348" stroke="#C95400" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M171 340 L177 350 L183 340" fill="none" stroke="#C95400" stroke-width="1.5"/>

    <text x="70" y="388" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">La barre peut vivre sur</text>
    <text x="70" y="407" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">n'importe quel bord.</text>
    <text x="70" y="434" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">Changer de bord change la</text>
    <text x="70" y="452" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">géométrie, pas les règles.</text>
    <text x="70" y="484" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">Les zones cliquables suivent</text>
    <text x="70" y="500" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">exactement le dessin.</text>
  </g>

  <!-- carte 2 -->
  <g>
    <rect x="330" y="196" width="258" height="318" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="330" y="196" width="258" height="5" rx="2.5" fill="#5F7F52"/>
    <text x="352" y="230" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.4" fill="#455F3D">CALIX</text>
    <text x="352" y="258" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#111418">La provenance</text>

    <rect x="352" y="276" width="214" height="86" rx="8" fill="#F7F3ED"/>
    <g font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9" fill="#5F7F52">
      <rect x="362" y="288" width="58" height="18" rx="4" fill="#E8EFE5"/><text x="368" y="300">dépôts</text>
      <rect x="362" y="312" width="58" height="18" rx="4" fill="#E8EFE5"/><text x="368" y="324">AUR</text>
      <rect x="362" y="336" width="58" height="18" rx="4" fill="#E8EFE5"/><text x="368" y="348">Flatpak</text>
    </g>
    <path d="M424 296 L466 330 M424 320 L466 330 M424 344 L466 330" stroke="#A1A6AD" stroke-width="1.2"/>
    <rect x="470" y="318" width="96" height="24" rx="6" fill="#5F7F52"/>
    <text x="480" y="334" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#fff">une seule liste</text>

    <text x="352" y="388" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">Un logiciel peut venir de</text>
    <text x="352" y="407" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">plusieurs endroits à la fois.</text>
    <text x="352" y="434" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">Chaque résultat garde son</text>
    <text x="352" y="452" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">origine visible.</text>
    <text x="352" y="484" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">La confiance dépend de la</text>
    <text x="352" y="500" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">source, pas du nom affiché.</text>
  </g>

  <!-- carte 3 -->
  <g>
    <rect x="612" y="196" width="258" height="318" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="612" y="196" width="258" height="5" rx="2.5" fill="#111418"/>
    <text x="634" y="230" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.4" fill="#111418">IN.GNU6</text>
    <text x="634" y="258" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#111418">La scène</text>

    <rect x="634" y="276" width="214" height="86" rx="8" fill="#F7F3ED"/>
    <g stroke="#111418" stroke-width="1.2" fill="none">
      <path d="M700 300 L760 310 L750 348 L690 342 Z"/>
      <path d="M760 310 L790 292"/>
    </g>
    <g fill="#111418">
      <circle cx="700" cy="300" r="5"/><circle cx="760" cy="310" r="5"/>
      <circle cx="750" cy="348" r="5"/><circle cx="690" cy="342" r="5"/><circle cx="790" cy="292" r="4"/>
    </g>
    <text x="640" y="354" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9" fill="#111418">objets + relations</text>

    <text x="634" y="388" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">Une scène, c'est des objets</text>
    <text x="634" y="407" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">et des liens entre eux.</text>
    <text x="634" y="434" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">L'affichage observe ; il ne</text>
    <text x="634" y="452" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">décide pas ce qui existe.</text>
    <text x="634" y="484" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">Deux rendus différents,</text>
    <text x="634" y="500" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">une seule vérité de scène.</text>
  </g>

  <!-- carte 4 -->
  <g>
    <rect x="894" y="196" width="258" height="318" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="894" y="196" width="258" height="5" rx="2.5" fill="#4169E1"/>
    <text x="916" y="230" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.4" fill="#2446A8">GNOSTRAL.RS</text>
    <text x="916" y="258" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#111418">La résidence</text>

    <rect x="916" y="276" width="214" height="86" rx="8" fill="#F7F3ED"/>
    <rect x="926" y="288" width="86" height="62" rx="6" fill="#E8EDFF" stroke="#4169E1"/>
    <text x="934" y="304" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="8.5" fill="#2446A8">CARTE</text>
    <g fill="#4169E1"><rect x="936" y="312" width="18" height="18" rx="3"/><rect x="958" y="312" width="18" height="18" rx="3"/></g>
    <rect x="1022" y="288" width="98" height="62" rx="6" fill="#FAF8F5" stroke="#A1A6AD"/>
    <text x="1030" y="304" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="8.5" fill="#667085">MÉMOIRE</text>
    <g fill="#A1A6AD"><rect x="1030" y="312" width="18" height="18" rx="3"/><rect x="1052" y="312" width="18" height="18" rx="3"/><rect x="1074" y="312" width="18" height="18" rx="3"/></g>

    <text x="916" y="388" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">Un expert sur la carte va</text>
    <text x="916" y="407" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">vite ; en mémoire, moins.</text>
    <text x="916" y="434" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">La place d'un morceau de</text>
    <text x="916" y="452" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">modèle est un choix mesuré.</text>
    <text x="916" y="484" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">22 → 13 couches sur la carte :</text>
    <text x="916" y="500" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">un placement, pas une migration.</text>
  </g>

  <text x="48" y="562" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">Dans les quatre cas, la même discipline : rendre la position explicite, la vérifier, et refuser de deviner.</text>
  <text x="48" y="592" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">Cette parenté est une lecture de l'auteur ; chaque dépôt publie ses propres preuves, séparément.</text>
</svg>
