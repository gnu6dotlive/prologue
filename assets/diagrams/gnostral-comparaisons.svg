<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
  <title id="t">Trois chiffres, trois références différentes</title>
  <desc id="d">Le 2,12× compare le moteur à lui-même avant et après le patch. Face à llama.cpp, gnostral reste à 58 pour cent. Face à mistral.rs, il n'y a pas de comparaison : c'est le même moteur.</desc>

  <rect width="1200" height="660" fill="#F7F3ED"/>

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#667085">GNOSTRAL.RS · LES RÉFÉRENCES</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#111418">Trois chiffres, trois questions différentes</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#667085">« 2,12× plus vite » ne dit rien tant qu'on ne précise pas : plus vite que quoi ?</text>

  <!-- CARTE 1 -->
  <g>
    <rect x="48" y="146" width="352" height="404" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="48" y="146" width="352" height="5" rx="2.5" fill="#4169E1"/>
    <text x="72" y="180" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.4" fill="#2446A8">QUESTION 1</text>
    <text x="72" y="208" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#111418">Le patch accélère-t-il</text>
    <text x="72" y="228" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#111418">le moteur ?</text>

    <text x="72" y="264" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#667085">avant — mistral.rs + résidence</text>
    <rect x="72" y="272" width="72" height="26" rx="5" fill="#A1A6AD"/>
    <text x="154" y="290" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#111418">9,51</text>

    <text x="72" y="324" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#667085">après — poids d'experts empruntés</text>
    <rect x="72" y="332" width="153" height="26" rx="5" fill="#4169E1"/>
    <text x="235" y="350" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#2446A8">20,18</text>

    <text x="72" y="404" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#111418">2,12×</text>
    <text x="164" y="404" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#455F3D">plus vite</text>

    <text x="72" y="440" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#111418">Même modèle, même machine,</text>
    <text x="72" y="458" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#111418">mêmes prompts, même binaire.</text>
    <text x="72" y="482" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">Seul le code change : c'est un</text>
    <text x="72" y="500" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">A/B apparié, pas une course.</text>
  </g>

  <!-- CARTE 2 -->
  <g>
    <rect x="424" y="146" width="352" height="404" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="424" y="146" width="352" height="5" rx="2.5" fill="#5F7F52"/>
    <text x="448" y="180" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.4" fill="#455F3D">QUESTION 2</text>
    <text x="448" y="208" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#111418">Plus rapide que</text>
    <text x="448" y="228" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#111418">llama.cpp ?</text>

    <text x="448" y="264" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#667085">gnostral, après le patch</text>
    <rect x="448" y="272" width="153" height="26" rx="5" fill="#4169E1"/>
    <text x="611" y="290" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#2446A8">20,18</text>

    <text x="448" y="324" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#667085">llama.cpp, experts sur le CPU</text>
    <rect x="448" y="332" width="262" height="26" rx="5" fill="#5F7F52"/>
    <text x="718" y="350" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#455F3D">34,54</text>

    <text x="448" y="404" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#111418">58 %</text>
    <text x="538" y="404" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#C95400">du débit de llama.cpp</text>

    <text x="448" y="440" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#111418">Même modèle Qwen3-30B-A3B</text>
    <text x="448" y="458" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#111418">Q2_K, même RTX 3070.</text>
    <text x="448" y="482" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">Le dépôt écrit noir sur blanc :</text>
    <text x="448" y="500" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">pas de supériorité sur llama.cpp.</text>
  </g>

  <!-- CARTE 3 -->
  <g>
    <rect x="800" y="146" width="352" height="404" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="800" y="146" width="352" height="5" rx="2.5" fill="#111418"/>
    <text x="824" y="180" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.4" fill="#111418">QUESTION 3</text>
    <text x="824" y="208" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#111418">Et face à mistral.rs ?</text>

    <rect x="824" y="238" width="128" height="44" rx="8" fill="#FAF8F5" stroke="#A1A6AD"/>
    <text x="838" y="257" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9.5" fill="#667085">MOTEUR</text>
    <text x="838" y="273" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#111418">mistral.rs</text>

    <text x="962" y="266" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#667085">+</text>

    <rect x="984" y="238" width="128" height="44" rx="8" fill="#FFE5D2" stroke="#C95400"/>
    <text x="998" y="257" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9.5" fill="#C95400">MODIFICATION</text>
    <text x="998" y="273" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#C95400">patch Q-010</text>

    <rect x="824" y="306" width="288" height="40" rx="8" fill="#E8EDFF" stroke="#4169E1"/>
    <text x="840" y="331" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#2446A8">= le moteur effectivement mesuré</text>

    <text x="824" y="404" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="30" fill="#111418">C'est le même</text>
    <text x="824" y="434" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="30" fill="#111418">moteur.</text>

    <text x="824" y="468" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#111418">gnostral n'est pas un moteur</text>
    <text x="824" y="486" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#111418">concurrent : c'est un jeu de patches</text>
    <text x="824" y="504" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#111418">et d'outils autour de mistral.rs.</text>
  </g>

  <text x="48" y="586" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">Échelle des barres : 0 à 40 jetons par seconde. Mesures locales, une machine, un modèle, une quantisation.</text>
  <text x="48" y="610" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#A1A6AD">« Strata » est la révision de mistral.rs utilisée au laboratoire : base publique 0.9.3 plus l'intégration de résidence d'experts.</text>
  <text x="48" y="634" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#A1A6AD">Les modèles mesurés sont des Qwen, pas des modèles Mistral : « mistral.rs » désigne le moteur, pas l'entreprise.</text>
</svg>
