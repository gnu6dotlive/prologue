<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
  <title id="t">Débit de décodage : version de base contre version corrigée</title>
  <desc id="d">Quatre barres : à 128 jetons, 8,90 contre 21,93 jetons par seconde ; à 512 jetons, 9,51 contre 20,18. À droite, les effets sur le premier mot, le pré-remplissage et la mémoire.</desc>

  <rect width="1200" height="660" fill="#F7F3ED"/>

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#667085">GNOSTRAL.RS · MESURE A/B</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#111418">Deux fois plus vite, à mémoire presque égale</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#667085">Même machine, même modèle, même binaire — sauf le correctif mesuré. Trois répétitions par condition.</text>

  <!-- axe -->
  <g stroke="#E6E8EB" stroke-width="1">
    <line x1="96" y1="200" x2="768" y2="200"/>
    <line x1="96" y1="260" x2="768" y2="260"/>
    <line x1="96" y1="320" x2="768" y2="320"/>
    <line x1="96" y1="380" x2="768" y2="380"/>
    <line x1="96" y1="440" x2="768" y2="440"/>
  </g>
  <line x1="96" y1="500" x2="768" y2="500" stroke="#D7DADF" stroke-width="1.5"/>

  <g font-family="'Space Grotesk', sans-serif" font-size="11" fill="#A1A6AD" text-anchor="end">
    <text x="84" y="204">25</text>
    <text x="84" y="264">20</text>
    <text x="84" y="324">15</text>
    <text x="84" y="384">10</text>
    <text x="84" y="444">5</text>
    <text x="84" y="504">0</text>
  </g>
  <text x="96" y="186" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#667085">jetons par seconde (médiane)</text>

  <!-- groupe 128 -->
  <text x="150" y="536" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="1.4" fill="#667085">RÉPONSE DE 128 JETONS</text>

  <rect x="150" y="393.2" width="92" height="106.8" rx="6" fill="#A1A6AD"/>
  <text x="196" y="381" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="17" fill="#111418" text-anchor="middle">8,90</text>
  <text x="196" y="562" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085" text-anchor="middle">sans correctif</text>

  <rect x="266" y="236.8" width="92" height="263.2" rx="6" fill="#C95400"/>
  <text x="312" y="225" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="17" fill="#C95400" text-anchor="middle">21,93</text>
  <text x="312" y="562" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085" text-anchor="middle">avec correctif</text>

  <text x="312" y="266" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">× 2,47</text>

  <!-- groupe 512 -->
  <text x="470" y="536" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="1.4" fill="#667085">RÉPONSE DE 512 JETONS</text>

  <rect x="470" y="385.9" width="92" height="114.1" rx="6" fill="#A1A6AD"/>
  <text x="516" y="374" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="17" fill="#111418" text-anchor="middle">9,51</text>
  <text x="516" y="562" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085" text-anchor="middle">sans correctif</text>

  <rect x="586" y="257.8" width="92" height="242.2" rx="6" fill="#C95400"/>
  <text x="632" y="246" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="17" fill="#C95400" text-anchor="middle">20,18</text>
  <text x="632" y="562" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085" text-anchor="middle">avec correctif</text>

  <text x="632" y="287" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">× 2,12</text>

  <!-- panneau latéral -->
  <rect x="808" y="168" width="344" height="352" rx="12" fill="#FFFFFF" stroke="#D7DADF"/>
  <text x="832" y="200" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.6" fill="#667085">CE QUE LA VITESSE A COÛTÉ</text>

  <text x="832" y="236" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">Premier mot affiché</text>
  <text x="832" y="262" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#111418">3 818 → 1 422 <tspan font-size="12" font-weight="500" fill="#667085">ms</tspan></text>

  <line x1="832" y1="286" x2="1128" y2="286" stroke="#E6E8EB"/>

  <text x="832" y="314" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">Pré-remplissage, 512 jetons</text>
  <text x="832" y="340" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#111418">7 248 → 2 676 <tspan font-size="12" font-weight="500" fill="#667085">ms</tspan></text>

  <line x1="832" y1="364" x2="1128" y2="364" stroke="#E6E8EB"/>

  <text x="832" y="392" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">Mémoire GPU totale, au pic</text>
  <text x="832" y="418" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#111418">2 344 → 2 351 <tspan font-size="12" font-weight="500" fill="#667085">Mio</tspan></text>

  <line x1="832" y1="442" x2="1128" y2="442" stroke="#E6E8EB"/>

  <text x="832" y="470" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">Mémoire hôte, au pic</text>
  <text x="832" y="496" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#111418">22 094 → 22 172 <tspan font-size="12" font-weight="500" fill="#667085">Mio</tspan></text>

  <!-- bandeau -->
  <rect x="48" y="584" width="1104" height="36" rx="8" fill="#FFE5D2" stroke="#C95400"/>
  <text x="68" y="607" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#111418">Ce gain est relatif au même moteur sans le correctif. Face à llama.cpp, gnostral atteint environ 58 % du débit — l'écart reste ouvert.</text>

  <text x="48" y="646" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#A1A6AD">Données : gnostral.rs/evidence/runs/q010-hotpath-ssd-ab-audit-20261010.json — 12 réponses mesurées, 3 processus par condition.</text>
</svg>
