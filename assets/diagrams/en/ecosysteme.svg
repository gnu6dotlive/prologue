<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d">
  <title id="t">Map of the four public repositories</title>
  <desc id="d">gnosix and gnostral.rs are in the foreground. Calix and in.gnu6 light up the context. A common thread links the four projects: topology.</desc>

  <rect width="1200" height="690" fill="#F7F3ED"/>

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#667085">PUBLIC ECOSYSTEM — GITHUB.COM/GNU6DOTLIVE</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#111418">Four repositories, four trades</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#667085">Four projects, four dossiers. Two links connect them: an interface foundation and one shared question.</text>

  <!-- gnosix -->
  <g>
    <rect x="48" y="146" width="536" height="238" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="48" y="146" width="6" height="238" rx="3" fill="#C95400"/>
    <text x="80" y="180" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#C95400">PROJECT 1 · THE DESKTOP</text>
    <text x="80" y="222" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#111418">gnosix</text>
    <text x="80" y="258" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#111418">A complete desktop environment for Linux,</text>
    <text x="80" y="281" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#111418">written in Rust and drawn natively on screen.</text>
    <rect x="80" y="308" width="306" height="26" rx="13" fill="#FFE5D2"/>
    <text x="94" y="326" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#C95400">26.11-rc1 « Ardoise » · public pre-release</text>
    <text x="80" y="360" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">Bar, deck, windows, settings, lock screen.</text>
  </g>

  <!-- gnostral -->
  <g>
    <rect x="616" y="146" width="536" height="238" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="616" y="146" width="6" height="238" rx="3" fill="#4169E1"/>
    <text x="648" y="180" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#2446A8">PROJECT 2 · THE ENGINE</text>
    <text x="648" y="222" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#111418">gnostral.rs</text>
    <text x="648" y="258" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#111418">An open lab for running AI models</text>
    <text x="648" y="281" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#111418">on a modest GPU, in Rust.</text>
    <rect x="648" y="308" width="296" height="26" rx="13" fill="#E8EDFF"/>
    <text x="662" y="326" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#2446A8">v0.8.0 · research, not a finished product</text>
    <text x="648" y="360" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">Measurements, typed contracts, replayable evidence.</text>
  </g>

  <!-- lien gnosix / calix -->
  <line x1="300" y1="386" x2="300" y2="424" stroke="#A1A6AD" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="300" cy="386" r="3" fill="#A1A6AD"/>
  <circle cx="300" cy="424" r="3" fill="#A1A6AD"/>
  <text x="314" y="410" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#667085">same interface foundation: Rust + GPUI</text>

  <!-- calix -->
  <g>
    <rect x="48" y="426" width="336" height="190" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <text x="74" y="458" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.8" fill="#667085">PROJECT 3 · THE COMPANION</text>
    <text x="74" y="494" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="25" fill="#111418">Calix</text>
    <text x="74" y="524" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#111418">Install and update software</text>
    <text x="74" y="544" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#111418">from a single window, on Arch Linux.</text>
    <text x="74" y="578" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#667085">Rust + Zig · GPL-3.0</text>
    <text x="74" y="598" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">The graphical interface of a package manager</text>
  </g>

  <!-- in.gnu6 -->
  <g>
    <rect x="408" y="426" width="336" height="190" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <text x="434" y="458" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.8" fill="#667085">PROJECT 4 · THE SCENE</text>
    <text x="434" y="494" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="25" fill="#111418">in.gnu6</text>
    <text x="434" y="524" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#111418">A scene and topology engine,</text>
    <text x="434" y="544" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#111418">without imposing a graphical interface.</text>
    <text x="434" y="578" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#667085">2026.10 · research</text>
    <text x="434" y="598" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">The scene engine the idea of topology comes from</text>
  </g>

  <!-- fil rouge -->
  <g>
    <rect x="768" y="426" width="384" height="190" rx="14" fill="#E6E8EB" stroke="#D7DADF"/>
    <text x="794" y="458" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.8" fill="#111418">THE COMMON THREAD</text>
    <text x="794" y="494" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="25" fill="#111418">Topology</text>
    <text x="794" y="524" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#667085">Where things are — and what</text>
    <text x="794" y="544" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#667085">their position allows — is a problem</text>
    <text x="794" y="564" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#667085">shared by all four projects.</text>
    <text x="794" y="598" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#111418">Desktop, packages, scene, memory: one question.</text>
  </g>

  <text x="48" y="660" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">Plain-language diagram. gnosix, gnostral.rs and Calix are under free licences; in.gnu6 is public with no OSS licence decided. The states shown are those of their status documents.</text>
</svg>
