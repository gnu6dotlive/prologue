<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d">
  <title id="t">One scene, several projectors</title>
  <desc id="d">The scene holds identities, relations, time and constraints. Three different projectors show it without being able to redefine it.</desc>

  <rect width="1200" height="580" fill="#111418" />

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#ADB7C1">IN.GNU6 · THE PRINCIPLE</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#F7F3ED">One scene, several projectors</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#ADB7C1">The engine decides what exists. A renderer only decides how to show it.</text>

  <defs>
    <marker id="g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8D99A6" />
    </marker>
  </defs>

  
  <g>
    <rect x="48" y="150" width="470" height="330" rx="14" fill="#1D2228" stroke="#F7F3ED" stroke-width="1.6" />
    <rect x="48" y="150" width="470" height="46" rx="14" fill="#F7F3ED" />
    <rect x="48" y="174" width="470" height="22" fill="#F7F3ED" />
    <text x="72" y="179" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" letter-spacing="1.8" fill="#111418">THE SCENE · WHAT EXISTS</text>

    <g font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#F7F3ED">
      <rect x="72" y="220" width="200" height="34" rx="8" fill="#111418" stroke="#323A40" />
      <text x="88" y="242" fill="#F7F3ED">identities</text>

      <rect x="288" y="220" width="206" height="34" rx="8" fill="#111418" stroke="#323A40" />
      <text x="304" y="242" fill="#F7F3ED">relations</text>

      <rect x="72" y="264" width="200" height="34" rx="8" fill="#111418" stroke="#323A40" />
      <text x="88" y="286" fill="#F7F3ED">hierarchy</text>

      <rect x="288" y="264" width="206" height="34" rx="8" fill="#111418" stroke="#323A40" />
      <text x="304" y="286" fill="#F7F3ED">spatial constraints</text>

      <rect x="72" y="308" width="200" height="34" rx="8" fill="#111418" stroke="#323A40" />
      <text x="88" y="330" fill="#F7F3ED">deterministic time</text>

      <rect x="288" y="308" width="206" height="34" rx="8" fill="#111418" stroke="#323A40" />
      <text x="304" y="330" fill="#F7F3ED">dynamics</text>

      <rect x="72" y="352" width="200" height="34" rx="8" fill="#111418" stroke="#323A40" />
      <text x="88" y="374" fill="#F7F3ED">topology</text>

      <rect x="288" y="352" width="206" height="34" rx="8" fill="#111418" stroke="#323A40" />
      <text x="304" y="374" fill="#F7F3ED">observations</text>
    </g>

    <text x="72" y="420" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#ADB7C1">The engine does not know what a desktop,</text>
    <text x="72" y="440" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#ADB7C1">a dock, a shop or a jewel is. It knows</text>
    <text x="72" y="460" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#ADB7C1">where things are and what they can do.</text>
  </g>

  
  <g stroke="#8D99A6" stroke-width="1.5">
    <line x1="524" y1="210" x2="596" y2="210" marker-end="url(#g)" />
    <line x1="524" y1="300" x2="596" y2="300" marker-end="url(#g)" />
    <line x1="524" y1="390" x2="596" y2="390" marker-end="url(#g)" />
  </g>

  
  <g>
    <rect x="608" y="168" width="544" height="88" rx="12" fill="#1D2228" stroke="#323A40" />
    <rect x="608" y="168" width="5" height="88" rx="2.5" fill="#4169E1" />
    <text x="634" y="196" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.6" fill="#87A0F4">PROJECTION 1 · BROWSER</text>
    <text x="634" y="220" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">PixiJS 8.22 / WebGL — the reference renderer,</text>
    <text x="634" y="240" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">replaceable by another without touching the scene.</text>

    <rect x="608" y="268" width="544" height="88" rx="12" fill="#1D2228" stroke="#323A40" />
    <rect x="608" y="268" width="5" height="88" rx="2.5" fill="#F7F3ED" />
    <text x="634" y="296" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.6" fill="#F7F3ED">PROJECTION 2 · NATIVE VULKAN</text>
    <text x="634" y="320" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">GPU-05 research: two positive first-frame</text>
    <text x="634" y="340" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">A/B runs; the CP03 contract remains open.</text>

    <rect x="608" y="368" width="544" height="88" rx="12" fill="#1D2228" stroke="#323A40" />
    <rect x="608" y="368" width="5" height="88" rx="2.5" fill="#8DA982" />
    <text x="634" y="396" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.6" fill="#8DA982">PROJECTION 3 · A PRODUCT</text>
    <text x="634" y="420" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">Docklab, gnu6.live, SP Joaillerie: they own</text>
    <text x="634" y="440" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">their trade, never a second scene.</text>
  </g>

  
  <rect x="48" y="500" width="1104" height="48" rx="10" fill="#1A1F24" stroke="#C95400" />
  <text x="72" y="530" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#F7F3ED">A projector may observe and draw. It may not rename, move or invent what exists.</text>

  <text x="48" y="570" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#8D99A6">Plain-language diagram. Based on README.md and CONTRACT.md in the in.gnu6 repository.</text>
</svg>
