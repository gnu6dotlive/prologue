<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">How the model's 48 layers are split between graphics card and processor</title>
  <desc id="d">In the control run, 22 layers fit on the card and 26 on the processor. Under memory pressure, 13 layers stay on the card and 35 move to the processor, for almost the same throughput.</desc>

  <rect width="1200" height="560" fill="#111418" />

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#ADB7C1">GNOSTRAL.RS · PLACEMENT UNDER PRESSURE</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#F7F3ED">When memory fills up, the model falls back</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#ADB7C1">The engine puts each layer on the card or on the processor, depending on the memory left to it.</text>

  
