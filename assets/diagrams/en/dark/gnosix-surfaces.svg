      <circle cx="664" cy="145" r="4" fill="#FF6A00" />
    </g>

    
    <rect x="104" y="200" width="290" height="190" rx="10" fill="#1D2228" stroke="#323A40" />
    <path d="M104 210 a10 10 0 0 1 10 -10 h270 a10 10 0 0 1 10 10 v18 h-290 z" fill="#1D2228" />
    <circle cx="122" cy="214" r="4" fill="#323A40" />
    <circle cx="136" cy="214" r="4" fill="#323A40" />
    <circle cx="150" cy="214" r="4" fill="#323A40" />
    <rect x="124" y="250" width="160" height="9" rx="4.5" fill="#2B3138" />
    <rect x="124" y="270" width="220" height="9" rx="4.5" fill="#2B3138" />
