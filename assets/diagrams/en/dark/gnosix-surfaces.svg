<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a gnosix desktop</title>
  <desc id="d">Diagram of a gnosix screen: the bar at the top, the desktop in the middle, the deck at the bottom, the AppStack opening above it.</desc>

  <rect width="1200" height="640" fill="#111418" />

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#ADB7C1">GNOSIX · ON SCREEN</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#F7F3ED">What you see, and what it is called</text>

  
  <g>
    <rect x="48" y="122" width="660" height="416" rx="12" fill="#1D2228" stroke="#F7F3ED" stroke-width="1.5" />
    <rect x="50" y="124" width="656" height="412" rx="11" fill="#14181C" />
    <circle cx="620" cy="210" r="110" fill="#2B3138" opacity="0.7" />

    
