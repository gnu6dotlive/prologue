  <g font-family="'Space Grotesk', sans-serif">
    <line x1="692" y1="148" x2="742" y2="148" stroke="#C95400" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="692" cy="148" r="3" fill="#C95400" />
    <text x="754" y="143" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.4" fill="#FF8E40">THE BAR</text>
    <text x="754" y="162" font-size="12.5" fill="#F7F3ED">Travels from edge to edge;</text>
    <text x="754" y="179" font-size="12.5" fill="#F7F3ED">its modules follow it.</text>

    <line x1="396" y1="222" x2="742" y2="238" stroke="#8DA982" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="396" cy="222" r="3" fill="#8DA982" />
    <text x="754" y="233" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.4" fill="#8DA982">THE DESKTOP</text>
    <text x="754" y="252" font-size="12.5" fill="#F7F3ED">Windows, wallpaper and</text>
    <text x="754" y="269" font-size="12.5" fill="#F7F3ED">modules placed on the surface.</text>

    <line x1="638" y1="300" x2="742" y2="330" stroke="#4169E1" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="638" cy="300" r="3" fill="#4169E1" />
    <text x="754" y="325" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.4" fill="#87A0F4">THE APPSTACK</text>
    <text x="754" y="344" font-size="12.5" fill="#F7F3ED">Find an application,</text>
    <text x="754" y="361" font-size="12.5" fill="#F7F3ED">open it with a safe gesture.</text>

    <line x1="482" y1="492" x2="742" y2="470" stroke="#F7F3ED" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="482" cy="492" r="3" fill="#F7F3ED" />
    <text x="754" y="465" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.4" fill="#F7F3ED">THE DECK</text>
    <text x="754" y="484" font-size="12.5" fill="#F7F3ED">Pins and open applications,</text>
    <text x="754" y="501" font-size="12.5" fill="#F7F3ED">with magnification.</text>
  </g>

  <text x="48" y="586" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#8D99A6">Simplified diagram: real proportions and positions are computed by the program, not drawn by hand.</text>
  <text x="48" y="608" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#8D99A6">Each surface has its own level of proof, published in docs/status/STATUS.md.</text>
</svg>
