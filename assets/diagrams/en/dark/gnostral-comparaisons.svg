<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
  <title id="t">Three figures, three different references</title>
  <desc id="d">The 2.12× compares the engine with itself before and after the patch. Against llama.cpp, gnostral stays at 58 percent. Against mistral.rs there is no comparison: it is the same engine.</desc>

  <rect width="1200" height="660" fill="#111418" />

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#ADB7C1">GNOSTRAL.RS · THE REFERENCES</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#F7F3ED">Three figures, three different questions</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#ADB7C1">“2.12× faster” says nothing until you specify: faster than what?</text>

  
  <g>
    <rect x="48" y="146" width="352" height="404" rx="14" fill="#1D2228" stroke="#323A40" />
    <rect x="48" y="146" width="352" height="5" rx="2.5" fill="#4169E1" />
    <text x="72" y="180" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.4" fill="#87A0F4">QUESTION 1</text>
    <text x="72" y="208" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#F7F3ED">Does the patch speed up</text>
    <text x="72" y="228" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#F7F3ED">the engine?</text>

    <text x="72" y="264" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ADB7C1">before — mistral.rs + residency</text>
    <rect x="72" y="272" width="72" height="26" rx="5" fill="#8D99A6" />
    <text x="154" y="290" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#F7F3ED">9.51</text>

    <text x="72" y="324" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ADB7C1">after — borrowed expert weights</text>
    <rect x="72" y="332" width="153" height="26" rx="5" fill="#4169E1" />
    <text x="235" y="350" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#87A0F4">20.18</text>

    <text x="72" y="404" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#F7F3ED">2.12×</text>
    <text x="164" y="404" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#8DA982">faster</text>

    <text x="72" y="440" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#F7F3ED">Same model, same machine,</text>
    <text x="72" y="458" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#F7F3ED">same prompts, same binary.</text>
    <text x="72" y="482" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#ADB7C1">Only the code changes: it is a</text>
    <text x="72" y="500" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#ADB7C1">paired A/B, not a race.</text>
  </g>

  
  <g>
    <rect x="424" y="146" width="352" height="404" rx="14" fill="#1D2228" stroke="#323A40" />
    <rect x="424" y="146" width="352" height="5" rx="2.5" fill="#8DA982" />
    <text x="448" y="180" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.4" fill="#8DA982">QUESTION 2</text>
    <text x="448" y="208" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#F7F3ED">Faster than</text>
    <text x="448" y="228" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#F7F3ED">llama.cpp?</text>

    <text x="448" y="264" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ADB7C1">gnostral, after the patch</text>
    <rect x="448" y="272" width="153" height="26" rx="5" fill="#4169E1" />
    <text x="611" y="290" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#87A0F4">20.18</text>

    <text x="448" y="324" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ADB7C1">llama.cpp, experts on the CPU</text>
    <rect x="448" y="332" width="262" height="26" rx="5" fill="#8DA982" />
    <text x="718" y="350" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#8DA982">34.54</text>

    <text x="448" y="404" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" fill="#F7F3ED">58 %</text>
    <text x="538" y="404" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#FF8E40">of llama.cpp's throughput</text>

    <text x="448" y="440" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#F7F3ED">Same Qwen3-30B-A3B model</text>
    <text x="448" y="458" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#F7F3ED">Q2_K, same RTX 3070.</text>
    <text x="448" y="482" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#ADB7C1">The repository says it plainly:</text>
    <text x="448" y="500" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#ADB7C1">no superiority over llama.cpp.</text>
  </g>

  
  <g>
    <rect x="800" y="146" width="352" height="404" rx="14" fill="#1D2228" stroke="#323A40" />
    <rect x="800" y="146" width="352" height="5" rx="2.5" fill="#F7F3ED" />
    <text x="824" y="180" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" letter-spacing="1.4" fill="#F7F3ED">QUESTION 3</text>
    <text x="824" y="208" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="600" fill="#F7F3ED">And against mistral.rs?</text>

    <rect x="824" y="238" width="128" height="44" rx="8" fill="#14181C" stroke="#8D99A6" />
    <text x="838" y="257" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9.5" fill="#ADB7C1">ENGINE</text>
    <text x="838" y="273" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#F7F3ED">mistral.rs</text>

    <text x="962" y="266" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ADB7C1">+</text>

    <rect x="984" y="238" width="128" height="44" rx="8" fill="#1A1F24" stroke="#C95400" />
    <text x="998" y="257" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9.5" fill="#FF8E40">CHANGE</text>
    <text x="998" y="273" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#FF8E40">Q-010 patch</text>

    <rect x="824" y="306" width="288" height="40" rx="8" fill="#1A1F24" stroke="#4169E1" />
    <text x="840" y="331" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#87A0F4">= the engine actually measured</text>

    <text x="824" y="404" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="30" fill="#F7F3ED">It is the same</text>
    <text x="824" y="434" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="30" fill="#F7F3ED">engine.</text>

    <text x="824" y="468" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#F7F3ED">gnostral is not a competing</text>
    <text x="824" y="486" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#F7F3ED">engine: it is a set of patches</text>
    <text x="824" y="504" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#F7F3ED">and tools around mistral.rs.</text>
  </g>

  <text x="48" y="586" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#ADB7C1">Bar scale: 0 to 40 tokens per second. Local measurements, one machine, one model, one quantisation.</text>
  <text x="48" y="610" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8D99A6">“Strata” is the mistral.rs revision used in the lab: public base 0.9.3 plus the expert-residency integration.</text>
  <text x="48" y="634" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8D99A6">The models measured are Qwen models, not Mistral models: “mistral.rs” names the engine, not the company.</text>
</svg>
