<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
  <title id="t">The four planes of gnosix</title>
  <desc id="d">gnosix separates observing the desktop, durable state, display and the right to act. Data flows between the planes, but authority does not follow automatically.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8D99A6" />
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#111418" />

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#ADB7C1">GNOSIX · ARCHITECTURE</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#F7F3ED">Four planes, four responsibilities</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#ADB7C1">Each plane does one thing. None owns the other three.</text>

  
  <g>
    <rect x="48" y="152" width="250" height="214" rx="14" fill="#1D2228" stroke="#323A40" />
    <rect x="48" y="152" width="250" height="5" rx="2.5" fill="#4169E1" />
    <text x="72" y="188" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#87A0F4">PLANE 1</text>
    <text x="72" y="218" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="21" fill="#F7F3ED">Observe</text>
    <text x="72" y="248" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">The compositor describes what</text>
    <text x="72" y="267" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">exists: screens, windows,</text>
    <text x="72" y="286" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">workspaces, focus.</text>
    <text x="72" y="316" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">Translated into typed facts,</text>
    <text x="72" y="333" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">never into guesses.</text>
  </g>

  
  <g>
    <rect x="328" y="152" width="250" height="214" rx="14" fill="#1D2228" stroke="#323A40" />
    <rect x="328" y="152" width="250" height="5" rx="2.5" fill="#8DA982" />
    <text x="352" y="188" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#8DA982">PLANE 2</text>
    <text x="352" y="218" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="21" fill="#F7F3ED">Remember</text>
    <text x="352" y="248" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">Durable identities, profiles,</text>
    <text x="352" y="267" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">settings. What survives</text>
    <text x="352" y="286" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">a shutdown.</text>
    <text x="352" y="316" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">A plugged-in screen is not</text>
    <text x="352" y="333" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">a “known” screen.</text>
  </g>

  
  <g>
    <rect x="608" y="152" width="250" height="214" rx="14" fill="#1D2228" stroke="#323A40" />
    <rect x="608" y="152" width="250" height="5" rx="2.5" fill="#C95400" />
    <text x="632" y="188" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#FF8E40">PLANE 3</text>
    <text x="632" y="218" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="21" fill="#F7F3ED">Show</text>
    <text x="632" y="248" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">Bar, deck, windows:</text>
    <text x="632" y="267" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">geometry is product data,</text>
    <text x="632" y="286" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">not decoration.</text>
    <text x="632" y="316" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">The same computation serves</text>
    <text x="632" y="333" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">drawing and clicks.</text>
  </g>

  
  <g>
    <rect x="888" y="152" width="250" height="214" rx="14" fill="#1D2228" stroke="#323A40" />
    <rect x="888" y="152" width="250" height="5" rx="2.5" fill="#F7F3ED" />
    <text x="912" y="188" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" fill="#F7F3ED">PLANE 4</text>
    <text x="912" y="218" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="21" fill="#F7F3ED">Act</text>
    <text x="912" y="248" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">Lock, launch, switch</text>
    <text x="912" y="267" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">workspace: rare,</text>
    <text x="912" y="286" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#F7F3ED">supervised gestures.</text>
    <text x="912" y="316" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">Each request is</text>
    <text x="912" y="333" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">checked, then traced.</text>
  </g>

  
  <line x1="302" y1="258" x2="324" y2="258" stroke="#8D99A6" stroke-width="1.5" marker-end="url(#ar)" />
  <line x1="582" y1="258" x2="604" y2="258" stroke="#8D99A6" stroke-width="1.5" marker-end="url(#ar)" />
  <line x1="862" y1="258" x2="884" y2="258" stroke="#8D99A6" stroke-width="1.5" marker-end="url(#ar)" />

  
  <g>
    <rect x="48" y="406" width="545" height="140" rx="14" fill="#1A1F24" stroke="#8DA982" />
    <text x="74" y="438" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.6" fill="#8DA982">WHAT FLOWS</text>
    <text x="74" y="470" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#8DA982">Facts, identities, intentions.</text>
    <text x="74" y="494" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#8DA982">A plane may read another's work</text>
    <text x="74" y="518" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#8DA982">without inheriting its power to act.</text>
  </g>

  <g>
    <rect x="613" y="406" width="525" height="140" rx="14" fill="#1A1F24" stroke="#C95400" />
    <text x="639" y="438" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.6" fill="#FF8E40">WHAT DOES NOT FLOW</text>
    <text x="639" y="470" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#FF8E40">The right to change the desktop.</text>
    <text x="639" y="494" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#FF8E40">A name, a path, a running process</text>
    <text x="639" y="518" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#FF8E40">never prove a permission.</text>
  </g>

  <text x="48" y="590" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#8D99A6">If the state is unknown or stale, gnosix refuses the action rather than inventing normal behaviour.</text>
</svg>
