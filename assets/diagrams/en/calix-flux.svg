<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d">
  <title id="t">Six software sources, a single list</title>
  <desc id="d">On the left, six package ecosystems. In the middle, a versioned inventory. On the right, rows that keep each package's origin.</desc>

  <rect width="1200" height="540" fill="#F7F3ED"/>

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#667085">CALIX · THE PROBLEM</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#111418">Six sources, a single list</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#667085">Each package comes from a different repository. The person at the screen has only one window.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A1A6AD"/>
    </marker>
  </defs>

  <!-- sources -->
  <text x="48" y="156" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#667085">THE SOURCES</text>

  <g font-family="'Space Grotesk', sans-serif" font-size="12.5" font-weight="600" fill="#111418">
    <rect x="48" y="172" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#D7DADF"/>
    <text x="64" y="194">ALPM · official repositories</text>

    <rect x="48" y="214" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#D7DADF"/>
    <text x="64" y="236">AUR · community repositories</text>

    <rect x="48" y="256" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#D7DADF"/>
    <text x="64" y="278">Flatpak · sandboxed packages</text>

    <rect x="48" y="298" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#D7DADF"/>
    <text x="64" y="320">AppImage · self-contained files</text>

    <rect x="48" y="340" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#D7DADF"/>
    <text x="64" y="362">Cargo · Rust libraries</text>

    <rect x="48" y="382" width="250" height="34" rx="8" fill="#FFFFFF" stroke="#D7DADF"/>
    <text x="64" y="404">NPM · JavaScript libraries</text>
  </g>

  <line x1="306" y1="294" x2="352" y2="294" stroke="#A1A6AD" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- inventaire -->
  <g>
    <rect x="364" y="172" width="322" height="244" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="364" y="172" width="6" height="244" rx="3" fill="#C95400"/>
    <text x="392" y="204" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.8" fill="#C95400">THE INVENTORY</text>
    <text x="392" y="240" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="23" fill="#111418">A versioned</text>
    <text x="392" y="268" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="23" fill="#111418">document</text>
    <text x="392" y="302" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#111418">One list, a dated format.</text>
    <text x="392" y="322" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#111418">A reader that does not understand</text>
    <text x="392" y="342" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#111418">the version refuses the document</text>
    <text x="392" y="362" font-family="'Space Grotesk', sans-serif" font-size="13.5" fill="#111418">instead of showing half of it.</text>
    <text x="392" y="392" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#667085">A single service writes this state.</text>
  </g>

  <line x1="694" y1="294" x2="740" y2="294" stroke="#A1A6AD" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- lignes avec provenance -->
  <g>
    <rect x="752" y="172" width="400" height="244" rx="14" fill="#FFFFFF" stroke="#D7DADF"/>
    <text x="776" y="204" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.8" fill="#667085">WHAT EACH ROW SAYS</text>

    <text x="776" y="242" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#111418">ripgrep</text>
    <rect x="1076" y="226" width="52" height="22" rx="4" fill="#FFE5D2"/>
    <text x="1086" y="241" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#C95400">AUR</text>

    <text x="776" y="284" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#111418">org.gnome.Builder</text>
    <rect x="1046" y="268" width="82" height="22" rx="4" fill="#E8EDFF"/>
    <text x="1056" y="283" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#2446A8">FLATPAK</text>

    <text x="776" y="326" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#111418">cargo-watch</text>
    <rect x="1056" y="310" width="72" height="22" rx="4" fill="#E8EFE5"/>
    <text x="1066" y="325" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#455F3D">CARGO</text>

    <text x="776" y="366" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">Provenance is not decoration: it decides</text>
    <text x="776" y="386" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">who installs, who updates, and with what right.</text>
  </g>

  <!-- bandeau -->
  <rect x="48" y="448" width="1104" height="48" rx="10" fill="#FFE5D2" stroke="#C95400"/>
  <text x="72" y="478" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#111418">Six ecosystems do not become a seventh. Calix lines the sources up side by side; it does not pass them off as equivalent.</text>

  <text x="48" y="524" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">Plain-language diagram. Based on README.md and docs/calix-architecture.md in the calix repository.</text>
</svg>
