<text x="520.0" y="406.0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="400" fill="#667085" text-anchor="start">Before: 1024 × 680, a number nobody had justified. Announced: 720 × 480.</text>
<text x="520.0" y="426.0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#C95400" text-anchor="start">Measured on the author's machine on October 29: 720 × 520.</text>
<text x="48.0" y="578.0" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="400" fill="#A1A6AD" text-anchor="start">Source: v0.3.0 release notes of gnu6dotlive/calix and docs/gpui/CONTRACT-01-SPACE-AUDIT.md; window measured on October 29, 2026.</text>
