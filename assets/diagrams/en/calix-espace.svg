<title id="t">Calix's spatial release: space, measured</title>
<desc id="d">On the left, in a 372-pixel band with the log open, the package list goes from 6.5 to 170.5 pixels. On the right, the minimum width added up: 495 + 22 + 143 + 56 = 716, rounded to 720.</desc>
