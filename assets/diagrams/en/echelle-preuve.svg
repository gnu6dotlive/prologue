<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
  <title id="t">The evidence ladder shared by both projects</title>
  <desc id="d">Five levels, from a project on paper to a product usable by a third party, with the vocabulary gnosix and gnostral.rs use at each level.</desc>

  <rect width="1200" height="660" fill="#F7F3ED"/>

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#667085">GLOSSARY · THE VOCABULARY</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#111418">“It works” means nothing on its own</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#667085">The two projects use different words for the same ladder. Here is the translation.</text>

  <!-- entêtes -->
  <text x="124" y="156" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.6" fill="#667085">WHAT IT MEANS</text>
  <text x="444" y="156" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.6" fill="#C95400">GNOSIX SAYS</text>
  <text x="804" y="156" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.6" fill="#2446A8">GNOSTRAL.RS SAYS</text>

  <!-- niveau 5 -->
  <g>
    <rect x="48" y="170" width="1104" height="76" rx="12" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="48" y="170" width="5" height="76" rx="2.5" fill="#455F3D"/>
    <text x="70" y="214" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="26" fill="#455F3D">5</text>
    <text x="124" y="202" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#111418">A third party can use it</text>
    <text x="124" y="224" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">Shipped, documented, supported for others.</text>
    <rect x="444" y="188" width="300" height="40" rx="8" fill="#FAF8F5"/>
    <text x="460" y="205" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">Not reached</text>
    <text x="460" y="221" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#A1A6AD">“not yet a desktop for others”</text>
    <rect x="804" y="188" width="316" height="40" rx="8" fill="#FAF8F5"/>
    <text x="820" y="205" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">Not reached</text>
    <text x="820" y="221" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#A1A6AD">“not a server ready to deploy”</text>
  </g>

  <!-- niveau 4 -->
  <g>
    <rect x="48" y="258" width="1104" height="76" rx="12" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="48" y="258" width="5" height="76" rx="2.5" fill="#5F7F52"/>
    <text x="70" y="302" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="26" fill="#455F3D">4</text>
    <text x="124" y="290" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#111418">Observed in real life</text>
    <text x="124" y="312" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">It runs on real hardware, witnessed.</text>
    <rect x="444" y="276" width="300" height="40" rx="8" fill="#E8EFE5"/>
    <text x="460" y="293" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#455F3D">PROVEN</text>
    <text x="460" y="309" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#455F3D">seen in the author's session</text>
    <rect x="804" y="276" width="316" height="40" rx="8" fill="#E8EDFF"/>
    <text x="820" y="293" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#2446A8">SINGLE-SERVER PASS</text>
    <text x="820" y="309" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#2446A8">a real server, a real answer</text>
  </g>

  <!-- niveau 3 -->
  <g>
    <rect x="48" y="346" width="1104" height="76" rx="12" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="48" y="346" width="5" height="76" rx="2.5" fill="#C95400"/>
    <text x="70" y="390" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="26" fill="#C95400">3</text>
    <text x="124" y="378" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#111418">Tested, but narrowly</text>
    <text x="124" y="400" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">A precise test passed, in isolation.</text>
    <rect x="444" y="364" width="300" height="40" rx="8" fill="#FFE5D2"/>
    <text x="460" y="381" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#C95400">QUALIFIED</text>
    <text x="460" y="397" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#C95400">qualified in an isolated session</text>
    <rect x="804" y="364" width="316" height="40" rx="8" fill="#E8EDFF"/>
    <text x="820" y="381" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#2446A8">BOUNDED PASS</text>
    <text x="820" y="397" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#2446A8">a bounded experiment passed</text>
  </g>

  <!-- niveau 2 -->
  <g>
    <rect x="48" y="434" width="1104" height="76" rx="12" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="48" y="434" width="5" height="76" rx="2.5" fill="#4169E1"/>
    <text x="70" y="478" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="26" fill="#2446A8">2</text>
    <text x="124" y="466" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#111418">Written and checked in source</text>
    <text x="124" y="488" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">The code compiles, the contracts hold.</text>
    <rect x="444" y="452" width="300" height="40" rx="8" fill="#E8EDFF"/>
    <text x="460" y="469" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#2446A8">SOURCE-QUALIFIED</text>
    <text x="460" y="485" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#2446A8">the invariants hold in source</text>
    <rect x="804" y="452" width="316" height="40" rx="8" fill="#E8EDFF"/>
    <text x="820" y="469" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#2446A8">CONTRACT TESTED</text>
    <text x="820" y="485" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#2446A8">the typed contract is tested</text>
  </g>

  <!-- niveau 1 -->
  <g>
    <rect x="48" y="522" width="1104" height="76" rx="12" fill="#FFFFFF" stroke="#D7DADF"/>
    <rect x="48" y="522" width="5" height="76" rx="2.5" fill="#A1A6AD"/>
    <text x="70" y="566" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="26" fill="#A1A6AD">1</text>
    <text x="124" y="554" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#111418">Only planned</text>
    <text x="124" y="576" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#667085">A document describes it; nothing is proven.</text>
    <rect x="444" y="540" width="300" height="40" rx="8" fill="#FAF8F5"/>
    <text x="460" y="557" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#667085">OPEN / EXPERIMENTAL</text>
    <text x="460" y="573" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#667085">a named obligation, not yet met</text>
    <rect x="804" y="540" width="316" height="40" rx="8" fill="#FAF8F5"/>
    <text x="820" y="557" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" fill="#667085">DESIGN / CONTRACT-ONLY</text>
    <text x="820" y="573" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#667085">designed, never run</text>
  </g>

  <text x="48" y="634" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#667085">Both projects refuse to jump from level 1 to level 5. That is why their evidence records exist.</text>
</svg>
