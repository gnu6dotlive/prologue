<title id="t">La version spatiale de Calix : l'espace mesuré</title>
<desc id="d">À gauche, dans une bande de 372 pixels avec le journal ouvert, la liste des paquets passe de 6,5 à 170,5 pixels. À droite, la largeur minimale additionnée : 495 + 22 + 143 + 56 = 716, arrondie à 720.</desc>
