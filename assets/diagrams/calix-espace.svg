<text x="48.0" y="86.0" font-family="'Space Grotesk', sans-serif" font-size="31" font-weight="700" fill="#111418" text-anchor="start">La version qui a mesuré l'espace</text>
<text x="48.0" y="114.0" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="400" fill="#667085" text-anchor="start">L'essentiel d'abord : la liste des paquets ne doit plus céder la place à sa propre légende.</text>
