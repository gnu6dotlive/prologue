<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">Anatomie d'un bureau gnosix</title>
  <desc id="d">Schéma d'un écran gnosix : la barre en haut, le bureau au centre, le deck en bas, l'appstack qui s'ouvre au-dessus.</desc>

  <rect width="1200" height="640" fill="#F7F3ED"/>

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#667085">GNOSIX · À L'ÉCRAN</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#111418">Ce que l'on voit, et comment c'est nommé</text>

  <!-- écran -->
  <g>
    <rect x="48" y="122" width="660" height="416" rx="12" fill="#FFFFFF" stroke="#111418" stroke-width="1.5"/>
    <rect x="50" y="124" width="656" height="412" rx="11" fill="#FAF8F5"/>
    <circle cx="620" cy="210" r="110" fill="#E6E8EB" opacity="0.7"/>

    <!-- barre -->
    <path d="M50 136 a11 11 0 0 1 11 -11 h634 a11 11 0 0 1 11 11 v20 h-656 z" fill="#111418"/>
    <g fill="#F7F3ED" opacity="0.9">
      <rect x="66" y="141" width="42" height="8" rx="4"/>
      <rect x="118" y="141" width="26" height="8" rx="4" opacity="0.6"/>
      <rect x="154" y="141" width="34" height="8" rx="4" opacity="0.6"/>
    </g>
    <g fill="#F7F3ED" opacity="0.9">
      <rect x="530" y="141" width="20" height="8" rx="4"/>
      <rect x="560" y="141" width="44" height="8" rx="4"/>
      <rect x="614" y="141" width="28" height="8" rx="4" opacity="0.6"/>
      <circle cx="664" cy="145" r="4" fill="#FF6A00"/>
    </g>

    <!-- fenêtre -->
    <rect x="104" y="200" width="290" height="190" rx="10" fill="#FFFFFF" stroke="#D7DADF"/>
    <path d="M104 210 a10 10 0 0 1 10 -10 h270 a10 10 0 0 1 10 10 v18 h-290 z" fill="#FFFFFF"/>
    <circle cx="122" cy="214" r="4" fill="#D7DADF"/>
    <circle cx="136" cy="214" r="4" fill="#D7DADF"/>
    <circle cx="150" cy="214" r="4" fill="#D7DADF"/>
    <rect x="124" y="250" width="160" height="9" rx="4.5" fill="#E6E8EB"/>
    <rect x="124" y="270" width="220" height="9" rx="4.5" fill="#E6E8EB"/>
    <rect x="124" y="290" width="190" height="9" rx="4.5" fill="#E6E8EB"/>
    <rect x="124" y="322" width="110" height="32" rx="8" fill="#FFE5D2"/>

    <!-- appstack -->
    <g>
      <rect x="424" y="276" width="212" height="146" rx="12" fill="#FFFFFF" stroke="#D7DADF"/>
      <rect x="442" y="296" width="110" height="9" rx="4.5" fill="#111418" opacity="0.75"/>
      <rect x="442" y="318" width="176" height="24" rx="8" fill="#FAF8F5"/>
      <g fill="#E6E8EB">
        <rect x="442" y="354" width="82" height="22" rx="6"/>
        <rect x="534" y="354" width="84" height="22" rx="6"/>
        <rect x="442" y="384" width="82" height="22" rx="6"/>
        <rect x="534" y="384" width="84" height="22" rx="6"/>
      </g>
    </g>

    <!-- deck -->
    <g>
      <rect x="204" y="466" width="276" height="52" rx="14" fill="#111418"/>
      <rect x="218" y="475" width="34" height="34" rx="9" fill="#FF6A00" opacity="0.9"/>
      <rect x="260" y="475" width="34" height="34" rx="9" fill="#F7F3ED" opacity="0.85"/>
      <rect x="302" y="475" width="34" height="34" rx="9" fill="#F7F3ED" opacity="0.6"/>
      <rect x="344" y="475" width="34" height="34" rx="9" fill="#F7F3ED" opacity="0.6"/>
      <rect x="386" y="475" width="34" height="34" rx="9" fill="#F7F3ED" opacity="0.35"/>
      <rect x="428" y="475" width="34" height="34" rx="9" fill="#F7F3ED" opacity="0.2"/>
      <circle cx="235" cy="514" r="2.5" fill="#FF6A00"/>
    </g>
  </g>

  <!-- annotations -->
  <g font-family="'Space Grotesk', sans-serif">
    <line x1="692" y1="148" x2="742" y2="148" stroke="#C95400" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="692" cy="148" r="3" fill="#C95400"/>
    <text x="754" y="143" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.4" fill="#C95400">LA BARRE</text>
    <text x="754" y="162" font-size="12.5" fill="#111418">Voyage d'un bord à l'autre ;</text>
    <text x="754" y="179" font-size="12.5" fill="#111418">ses modules la suivent.</text>

    <line x1="396" y1="222" x2="742" y2="238" stroke="#5F7F52" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="396" cy="222" r="3" fill="#5F7F52"/>
    <text x="754" y="233" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.4" fill="#455F3D">LE BUREAU</text>
    <text x="754" y="252" font-size="12.5" fill="#111418">Fenêtres, fond d'écran et</text>
    <text x="754" y="269" font-size="12.5" fill="#111418">modules posés sur la surface.</text>

    <line x1="638" y1="300" x2="742" y2="330" stroke="#4169E1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="638" cy="300" r="3" fill="#4169E1"/>
    <text x="754" y="325" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.4" fill="#2446A8">L'APPSTACK</text>
    <text x="754" y="344" font-size="12.5" fill="#111418">Chercher une application,</text>
    <text x="754" y="361" font-size="12.5" fill="#111418">la lancer d'un geste sûr.</text>

    <line x1="482" y1="492" x2="742" y2="470" stroke="#111418" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="482" cy="492" r="3" fill="#111418"/>
    <text x="754" y="465" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="11" letter-spacing="1.4" fill="#111418">LE DECK</text>
    <text x="754" y="484" font-size="12.5" fill="#111418">Épingles et applications</text>
    <text x="754" y="501" font-size="12.5" fill="#111418">ouvertes, avec magnification.</text>
  </g>

  <text x="48" y="586" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">Schéma simplifié : les proportions et les positions réelles sont calculées par le programme, pas dessinées à la main.</text>
  <text x="48" y="608" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#A1A6AD">Chaque surface a son propre niveau de preuve, publié dans docs/status/STATUS.md.</text>
</svg>
