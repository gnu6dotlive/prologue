<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d">
  <title id="t">La frontière de privilège de Calix</title>
  <desc id="d">L'interface, le service d'inventaire et les notifications tournent sans privilège. Une seule porte, polkit via pkexec, élève le moteur Zig pour les commandes qui modifient le système.</desc>

  <rect width="1200" height="540" fill="#111418" />

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#ADB7C1">CALIX · FRONTIÈRE DE PRIVILÈGE</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#F7F3ED">Les droits arrivent au dernier moment</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#ADB7C1">La question n'est pas « faut-il des droits ? » mais « combien de code les reçoit, et pendant combien de temps ? ».</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8D99A6" />
    </marker>
  </defs>

  
  <rect x="48" y="152" width="540" height="286" rx="12" fill="#1D2228" stroke="#323A40" />
  <text x="72" y="182" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.6" fill="#8DA982">SANS PRIVILÈGE</text>

  <g>
    <rect x="72" y="198" width="492" height="62" rx="8" fill="#111418" stroke="#323A40" />
    <text x="90" y="222" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13.5" fill="#F7F3ED">calix-gpui</text>
    <text x="90" y="244" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">L'interface : recherche, inspection, console d'opération.</text>

    <rect x="72" y="270" width="492" height="62" rx="8" fill="#111418" stroke="#323A40" />
    <text x="90" y="294" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13.5" fill="#F7F3ED">calix-daemon</text>
    <text x="90" y="316" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">L'inventaire : le seul écrivain de l'état, sur socket Unix.</text>

    <rect x="72" y="342" width="492" height="62" rx="8" fill="#111418" stroke="#323A40" />
    <text x="90" y="366" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13.5" fill="#F7F3ED">calix-notify</text>
    <text x="90" y="388" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">Les notifications : un signal du bus, une notification.</text>
  </g>

  <line x1="588" y1="295" x2="644" y2="295" stroke="#8D99A6" stroke-width="1.5" marker-end="url(#ar)" />

  
  <rect x="656" y="196" width="152" height="198" rx="12" fill="#1A1F24" stroke="#C95400" stroke-width="1.5" />
  <text x="732" y="228" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#FF8E40" text-anchor="middle">polkit</text>
  <text x="732" y="256" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#F7F3ED" text-anchor="middle">trois actions déclarées :</text>
  <text x="732" y="274" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#F7F3ED" text-anchor="middle">installer, retirer,</text>
  <text x="732" y="292" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#F7F3ED" text-anchor="middle">mettre à jour.</text>
  <text x="732" y="330" font-family="'Space Grotesk', sans-serif" font-size="10.5" fill="#FF8E40" text-anchor="middle">UNE SEULE PORTE</text>
  <text x="732" y="348" font-family="'Space Grotesk', sans-serif" font-size="10.5" fill="#FF8E40" text-anchor="middle">ÉTROITE ET EXPLICITE</text>

  <line x1="812" y1="295" x2="868" y2="295" stroke="#8D99A6" stroke-width="1.5" marker-end="url(#ar)" />

  
  <rect x="880" y="152" width="272" height="286" rx="12" fill="#F7F3ED" />
  <text x="904" y="182" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.6" fill="#667085">LES DROITS, POUR UNE ACTION</text>
  <rect x="904" y="204" width="224" height="86" rx="8" fill="#1D2228" />
  <text x="922" y="234" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#F7F3ED">calix · moteur Zig</text>
  <text x="922" y="256" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">relancé via pkexec : transactions</text>
  <text x="922" y="274" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#ADB7C1">ALPM, builds AUR, trousseau de clés.</text>

  <text x="904" y="326" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#667085">Seules les commandes qui modifient</text>
  <text x="904" y="344" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#667085">le système passent par cette porte ;</text>
  <text x="904" y="362" font-family="'Space Grotesk', sans-serif" font-size="11.5" fill="#667085">le reste tourne en utilisateur.</text>
  <text x="904" y="404" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#5F7F52">Un plantage sans droit</text>
  <text x="904" y="420" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#5F7F52">ne casse pas le système.</text>

  
  <rect x="48" y="462" width="1104" height="40" rx="8" fill="#1D2228" stroke="#323A40" />
  <text x="68" y="487" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#ADB7C1">Interdits par le projet, y compris dans la documentation d'installation :</text>
  <text x="540" y="488" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#8D99A6" text-decoration="line-through">sudo</text>
  <text x="592" y="488" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#8D99A6" text-decoration="line-through">su</text>
  <text x="624" y="488" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#8D99A6" text-decoration="line-through">doas</text>
  <text x="688" y="487" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#ADB7C1">— une seule voie d'élévation, traçable et révocable.</text>

  <text x="48" y="528" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#8D99A6">Schéma de vulgarisation. D'après calix/README.md et docs/calix-architecture.md.</text>
</svg>
