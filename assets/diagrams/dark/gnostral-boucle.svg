<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
  <title id="t">La boucle de preuve de gnostral.rs</title>
  <desc id="d">Six étapes : identifier la source, écrire un plan borné, exécuter dans un cadre isolé, vérifier une réponse exacte, arrêter et récupérer la mémoire, faire auditer par un programme indépendant.</desc>

  <rect width="1200" height="700" fill="#111418" />

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#ADB7C1">GNOSTRAL.RS · LA MÉTHODE</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#F7F3ED">Comment une mesure devient une preuve</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#ADB7C1">Six étapes, toujours les mêmes. Aucune ne peut être sautée.</text>

  <circle cx="600" cy="386" r="196" fill="none" stroke="#323A40" stroke-width="1.5" stroke-dasharray="4 5" />

  
  <g fill="#4169E1">
    <g transform="translate(675,256) rotate(30)"><path d="M-5 -5 L6 0 L-5 5 z" /></g>
    <g transform="translate(750,386) rotate(90)"><path d="M-5 -5 L6 0 L-5 5 z" /></g>
    <g transform="translate(675,516) rotate(150)"><path d="M-5 -5 L6 0 L-5 5 z" /></g>
    <g transform="translate(525,516) rotate(210)"><path d="M-5 -5 L6 0 L-5 5 z" /></g>
    <g transform="translate(450,386) rotate(270)"><path d="M-5 -5 L6 0 L-5 5 z" /></g>
    <g transform="translate(525,256) rotate(330)"><path d="M-5 -5 L6 0 L-5 5 z" /></g>
  </g>

  
  <g font-family="'Space Grotesk', sans-serif">
    
    <rect x="504" y="158" width="192" height="64" rx="12" fill="#1D2228" stroke="#323A40" />
    <text x="520" y="182" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#87A0F4">01</text>
    <text x="520" y="200" font-size="13.5" font-weight="600" fill="#F7F3ED">Source + empreinte</text>
    <text x="520" y="215" font-size="11" fill="#ADB7C1">code et modèle exacts</text>

    
    <rect x="704" y="258" width="192" height="64" rx="12" fill="#1D2228" stroke="#323A40" />
    <text x="720" y="282" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#87A0F4">02</text>
    <text x="720" y="300" font-size="13.5" font-weight="600" fill="#F7F3ED">Plan borné</text>
    <text x="720" y="315" font-size="11" fill="#ADB7C1">ce qui sera fait, rien de plus</text>

    
    <rect x="704" y="450" width="192" height="64" rx="12" fill="#1D2228" stroke="#323A40" />
    <text x="720" y="474" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#87A0F4">03</text>
    <text x="720" y="492" font-size="13.5" font-weight="600" fill="#F7F3ED">Exécution isolée</text>
    <text x="720" y="507" font-size="11" fill="#ADB7C1">un processus, des limites</text>

    
    <rect x="504" y="550" width="192" height="64" rx="12" fill="#1D2228" stroke="#323A40" />
    <text x="520" y="574" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#87A0F4">04</text>
    <text x="520" y="592" font-size="13.5" font-weight="600" fill="#F7F3ED">Réponse exacte</text>
    <text x="520" y="607" font-size="11" fill="#ADB7C1">le résultat attendu, vérifié</text>

    
    <rect x="304" y="450" width="192" height="64" rx="12" fill="#1D2228" stroke="#323A40" />
    <text x="320" y="474" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#87A0F4">05</text>
    <text x="320" y="492" font-size="13.5" font-weight="600" fill="#F7F3ED">Arrêt + récupération</text>
    <text x="320" y="507" font-size="11" fill="#ADB7C1">la mémoire revient</text>

    
    <rect x="304" y="258" width="192" height="64" rx="12" fill="#1D2228" stroke="#323A40" />
    <text x="320" y="282" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#87A0F4">06</text>
    <text x="320" y="300" font-size="13.5" font-weight="600" fill="#F7F3ED">Audit indépendant</text>
    <text x="320" y="315" font-size="11" fill="#ADB7C1">un autre programme contrôle</text>
  </g>

  
  <text x="600" y="372" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="17" fill="#F7F3ED">Un PASS ne dit</text>
  <text x="600" y="394" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="17" fill="#F7F3ED">que ce qu'il a testé.</text>
  <text x="600" y="420" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10.5" fill="#ADB7C1">rien de plus</text>

  
  <rect x="48" y="644" width="1104" height="34" rx="8" fill="#1A1F24" stroke="#C95400" />
  <text x="68" y="666" font-family="'Space Grotesk', sans-serif" font-size="12.5" fill="#FF8E40">Un échec n'est jamais effacé : il reste consigné avec sa cause. Le premier essai de Q-010 a échoué sur la récupération mémoire ; il fait toujours partie du dossier.</text>
</svg>
