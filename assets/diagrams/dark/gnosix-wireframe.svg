  <rect x="674" y="458" width="86" height="7" rx="3.5" fill="#2B3138" />
  <rect x="674" y="458" width="54" height="7" rx="3.5" fill="#C95400" />

  
  <rect x="264" y="468" width="296" height="54" rx="12" fill="#111418" stroke="#323A40" />
