  <rect x="446" y="278" width="96" height="8" rx="3" fill="#2B3138" />

  
  <rect x="630" y="240" width="158" height="74" rx="8" fill="#1D2228" stroke="#F7F3ED" stroke-width="1.2" />
  <circle cx="648" cy="258" r="6" fill="#1A1F24" stroke="#C95400" />
