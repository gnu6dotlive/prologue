  <circle cx="341" cy="495" r="4" fill="#C95400" />
  <circle cx="425" cy="495" r="4" fill="#C95400" />

  
  <g font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" text-anchor="middle">
    <circle cx="58" cy="201" r="9" fill="#F7F3ED" /><text x="58" y="204.5" fill="#111418">1</text>
    <circle cx="66" cy="252" r="9" fill="#F7F3ED" /><text x="66" y="255.5" fill="#111418">2</text>
    <circle cx="246" cy="495" r="9" fill="#F7F3ED" /><text x="246" y="498.5" fill="#111418">3</text>
    <circle cx="648" cy="228" r="9" fill="#F7F3ED" /><text x="648" y="231.5" fill="#111418">4</text>
    <circle cx="644" cy="450" r="9" fill="#F7F3ED" /><text x="644" y="453.5" fill="#111418">5</text>
  </g>

  
  <g font-family="'Space Grotesk', sans-serif">
    <circle cx="866" cy="196" r="11" fill="#F7F3ED" /><text x="866" y="200" font-weight="700" font-size="10" fill="#111418" text-anchor="middle">1</text>
    <text x="890" y="194" font-weight="700" font-size="14" fill="#F7F3ED">La barre</text>
    <text x="890" y="212" font-size="11.5" fill="#ADB7C1">Modules, bords, densité, épaisseur.</text>

    <circle cx="866" cy="256" r="11" fill="#F7F3ED" /><text x="866" y="260" font-weight="700" font-size="10" fill="#111418" text-anchor="middle">2</text>
    <text x="890" y="254" font-weight="700" font-size="14" fill="#F7F3ED">Les fenêtres</text>
    <text x="890" y="272" font-size="11.5" fill="#ADB7C1">Le bureau et son espace de travail.</text>

    <circle cx="866" cy="316" r="11" fill="#F7F3ED" /><text x="866" y="320" font-weight="700" font-size="10" fill="#111418" text-anchor="middle">3</text>
    <text x="890" y="314" font-weight="700" font-size="14" fill="#F7F3ED">Le deck</text>
    <text x="890" y="332" font-size="11.5" fill="#ADB7C1">Épingles et applications ouvertes.</text>

    <circle cx="866" cy="376" r="11" fill="#F7F3ED" /><text x="866" y="380" font-weight="700" font-size="10" fill="#111418" text-anchor="middle">4</text>
    <text x="890" y="374" font-weight="700" font-size="14" fill="#F7F3ED">La notification</text>
    <text x="890" y="392" font-size="11.5" fill="#ADB7C1">Gnosix est le service de la session.</text>

    <circle cx="866" cy="436" r="11" fill="#F7F3ED" /><text x="866" y="440" font-weight="700" font-size="10" fill="#111418" text-anchor="middle">5</text>
    <text x="890" y="434" font-weight="700" font-size="14" fill="#F7F3ED">L'affichage à l'écran</text>
    <text x="890" y="452" font-size="11.5" fill="#ADB7C1">Volume, luminosité, veille.</text>
  </g>

  <text x="48" y="586" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#8D99A6">Croquis de principe. D'après gnosix/docs/diagrams/02-surface-anatomy.svg et docs/status/STATUS.md.</text>
  <text x="48" y="604" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#8D99A6">Les formes suggèrent la disposition ; elles ne représentent aucune version livrée à l'identique.</text>
</svg>
