  <text x="128" y="257" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#ADB7C1">fenêtre · application</text>
  <g stroke="#2B3138">
    <line x1="100" y1="292" x2="398" y2="292" />
    <line x1="100" y1="316" x2="398" y2="316" />
    <line x1="100" y1="340" x2="398" y2="340" />
    <line x1="100" y1="364" x2="398" y2="364" />
