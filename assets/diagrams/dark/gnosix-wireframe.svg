<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
  <title id="t">Wireframe des surfaces du bureau gnosix</title>
  <desc id="d">Croquis d'un écran : barre en haut, deux fenêtres, deck en bas, notification à droite et affichage à l'écran. Cinq repères numérotés renvoient à la légende.</desc>

  <rect width="1200" height="620" fill="#111418" />

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#ADB7C1">GNOSIX · WIREFRAME</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#F7F3ED">Un bureau, cinq surfaces</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#ADB7C1">Où chaque chose se trouve — et ce que sa position autorise. Croquis de principe, pas une capture d'écran.</text>

  
  <rect x="48" y="150" width="764" height="398" rx="12" fill="#1D2228" stroke="#F7F3ED" stroke-width="1.4" />
  <text x="64" y="176" font-family="'Space Grotesk', sans-serif" font-size="10" letter-spacing="1.2" fill="#8D99A6">ÉCRAN 1 · 2560 × 1440</text>

  
  <rect x="64" y="184" width="732" height="34" rx="6" fill="#111418" stroke="#323A40" />
  <g fill="#1D2228" stroke="#8D99A6">
    <rect x="76" y="193" width="46" height="16" rx="3" />
