<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Répartition des 48 couches du modèle entre carte graphique et processeur</title>
  <desc id="d">En contrôle, 22 couches tiennent sur la carte et 26 sur le processeur. Sous pression mémoire, 13 couches restent sur la carte et 35 passent sur le processeur, pour un débit presque identique.</desc>

  <rect width="1200" height="560" fill="#111418" />

  <text x="48" y="46" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="12" letter-spacing="2.4" fill="#ADB7C1">GNOSTRAL.RS · PLACEMENT SOUS PRESSION</text>
  <text x="48" y="86" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="31" fill="#F7F3ED">Quand la mémoire se remplit, le modèle se replie</text>
  <text x="48" y="114" font-family="'Space Grotesk', sans-serif" font-size="14.5" fill="#ADB7C1">Le moteur place chaque couche sur la carte ou sur le processeur, selon la mémoire qu'on lui laisse.</text>

  
